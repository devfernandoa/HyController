version: '3.8'

# Docker Compose using pre-built images from GitHub Container Registry
# For production deployment on NAS or servers

services:
  # Panel Backend API
  backend:
    image: ghcr.io/${GITHUB_USERNAME:-OWNER}/hycontroller-backend:latest
    container_name: hycontroller-backend
    ports:
      - "3001:3001"
    volumes:
      # Docker socket to manage containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Access to Docker volumes for file management
      - /var/lib/docker/volumes:/var/lib/docker/volumes:rw
    environment:
      - PORT=3001
      - NODE_ENV=production
      - RUNNER_IMAGE=ghcr.io/${GITHUB_USERNAME:-OWNER}/hycontroller-runner:latest
    restart: unless-stopped
    networks:
      - hycontroller
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Panel Frontend UI
  frontend:
    image: ghcr.io/${GITHUB_USERNAME:-OWNER}/hycontroller-frontend:latest
    container_name: hycontroller-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
      - REACT_APP_WS_URL=ws://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hycontroller
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Pull the runner image (used by created servers)
  runner:
    image: ghcr.io/${GITHUB_USERNAME:-OWNER}/hycontroller-runner:latest
    container_name: hycontroller-runner-image
    command: echo "Runner image pulled successfully"
    restart: "no"

networks:
  hycontroller:
    name: hycontroller
    driver: bridge

# Note: Server volumes are created dynamically by the backend
# Each Hytale server will have its own named volume (hytale-{servername})
