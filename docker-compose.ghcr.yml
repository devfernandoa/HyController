version: '3.8'

# Docker Compose using pre-built images from GitHub Container Registry
# For production deployment on NAS or servers

services:
  # Panel Backend API
  backend:
    image: ghcr.io/devfernandoa/hycontroller-backend:latest
    container_name: hycontroller-backend
    ports:
      - "3001:3001"
    volumes:
      # Docker socket to manage containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Note: Volume path access is optional - backend uses Docker API
      # Uncomment and adjust path for your NAS if needed:
      # Ugreen NAS: /mnt/docker_data/volumes:/var/lib/docker/volumes:ro
      # Synology: /volume1/@docker/volumes:/var/lib/docker/volumes:ro
      # QNAP: /share/Container/container-station-data/lib/docker/volumes:/var/lib/docker/volumes:ro
    environment:
      - PORT=3001
      - NODE_ENV=production
      - RUNNER_IMAGE=ghcr.io/devfernandoa/hycontroller-runner:latest
    restart: unless-stopped
    networks:
      - hycontroller
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Panel Frontend UI
  frontend:
    image: ghcr.io/devfernandoa/hycontroller-frontend:latest
    container_name: hycontroller-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3001/api
      - REACT_APP_WS_URL=ws://localhost:3001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hycontroller
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  hycontroller:
    name: hycontroller
    driver: bridge

# Note: Server volumes are created dynamically by the backend
# Each Hytale server will have its own named volume (hytale-{servername})
